name: Build JARVIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            ccache build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3.0.0"

      - name: Check Project Files
        run: |
          echo "Checking JARVIS project..."
          test -f main.py || (echo "main.py missing!" && exit 1)
          test -f buildozer.spec || (echo "buildozer.spec missing!" && exit 1)
          echo "main.py found"
          echo "buildozer.spec found"

      - name: Clean Previous Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
